[tox]
minversion = 4.0
envlist = py3,pep8

[testenv]
usedevelop = True
# The parser API comes from the sibling clone of notque/pheme-audit-middleware
# (../openstack-audit-middleware), installed editable. Point
# AUDIT_MIDDLEWARE_SRC elsewhere if your clone lives somewhere else.
deps =
    -e {env:AUDIT_MIDDLEWARE_SRC:{toxinidir}/../openstack-audit-middleware}
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
commands = stestr run {posargs}

[testenv:pep8]
commands =
    flake8 {posargs}
    bandit -r phememiddleware -x tests -n5

[flake8]
enable-extensions = H106,H203,H904
ignore = E121,E122,E123,E124,E125,E126,E127,E128,E129,E131,E251,H405,W504
exclude = .venv,.git,.tox,dist,*lib/python*,*egg,build
max-complexity = 25
