[metadata]
name = pheme-middleware
summary = Publish CloudEvents for OpenStack API changes to NATS JetStream (Pheme)
description_file =
    README.md
long_description_content_type = text/markdown
author = notque
home_page = https://github.com/notque/pheme-middleware
python_requires = >=3.10
classifier =
    Environment :: OpenStack
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3

[files]
packages =
    phememiddleware

[entry_points]
paste.filter_factory =
    pheme = phememiddleware:filter_factory
