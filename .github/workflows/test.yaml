# Unit tests (py312, including test_nats against a nats container) and pep8
# (flake8 with hacking and docstrings, bandit), as run locally with tox.

name: Test
"on":
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tox:
    name: tox
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pbr takes the package version from the git history
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install tox
      - name: Run tox
        run: tox -e py312,pep8
